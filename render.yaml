services:
  - type: web
    name: bot-giat-say-dan-sinh
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn auto_reply_bot:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PAGE_ACCESS_TOKEN
        sync: false
      - key: VERIFY_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.0
